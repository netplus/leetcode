name: Reasoning diagram final polish

on:
  push:
    branches:
      - learning/reasoning-first-full-migration-v3

permissions:
  contents: write

jobs:
  polish-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: learning/reasoning-first-full-migration-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collapse doubled Unicode diagram strokes in canonical pedagogy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          total = 0
          touched = []
          for path in sorted(Path('tools').glob('pedagogy*.py')):
              text = path.read_text(encoding='utf-8')
              count = text.count('╲╲')
              if not count:
                  continue
              path.write_text(text.replace('╲╲', '╲'), encoding='utf-8')
              total += count
              touched.append((str(path), count))

          if total == 0:
              raise RuntimeError('no doubled Unicode diagram strokes found in canonical pedagogy')

          for path, count in touched:
              print(f'{path}: collapsed {count} doubled strokes')
          print(f'Collapsed doubled Unicode diagram strokes: {total}')
          PY

      - name: Check Python sources for warnings
        run: |
          python3 -Wall -m compileall -q tools 2>&1 | tee /tmp/python-warnings.log
          if grep -E 'SyntaxWarning|DeprecationWarning|warning:' /tmp/python-warnings.log; then
            echo 'Python warning remains after final diagram polish'
            exit 1
          fi

      - name: Regenerate learning artifacts
        run: |
          python3 tools/gen_all.py
          python3 tools/gen_review_report.py

      - name: Run fidelity and metadata gates
        run: |
          python3 tools/check_generated_fidelity.py
          make verify-meta

      - name: Run full compile and judges with zero compiler warnings
        run: |
          set -o pipefail
          make verify 2>&1 | tee /tmp/full-verify.log
          if grep -E 'warning:' /tmp/full-verify.log; then
            echo 'Compiler warning remains after final diagram polish'
            exit 1
          fi

      - name: Assert generated diagrams contain no doubled Unicode strokes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          offenders = []
          checked = 0
          for path in Path('problems').glob('**/solution.cpp'):
              checked += 1
              if '╲╲' in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))

          if offenders:
              raise RuntimeError('doubled Unicode tree stroke remains in: ' + ', '.join(offenders))
          if checked != 106:
              raise RuntimeError(f'expected 106 generated solution.cpp files, checked {checked}')
          print('Generated diagrams OK: 106/106 solution.cpp files contain no doubled Unicode diagonal strokes.')
          PY

      - name: Remove one-shot workflow and Python caches
        run: |
          rm -f .github/workflows/reasoning-diagram-final-polish.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit polished warning-free diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: polish warning-free tree diagrams"
          git push origin HEAD:learning/reasoning-first-full-migration-v3
