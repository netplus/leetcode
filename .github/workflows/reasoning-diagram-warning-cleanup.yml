name: Reasoning diagram warning cleanup

on:
  push:
    branches:
      - learning/reasoning-first-full-migration-v3

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: learning/reasoning-first-full-migration-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize diagram backslashes in canonical pedagogy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual_paths = [
              Path('tools/pedagogy_reasoning_manual.py'),
              Path('tools/pedagogy_week2_day9.py'),
              Path('tools/pedagogy_week2_day11.py'),
              Path('tools/pedagogy_week2_day13.py'),
              Path('tools/pedagogy_week2_day14.py'),
              Path('tools/pedagogy_week3_day18.py'),
          ]

          def normalize_visual_blocks(path: Path) -> int:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              out = []
              in_visual = False
              changed = 0

              for line in lines:
                  starts = (not in_visual) and ('"visual": """' in line)
                  if starts:
                      in_visual = True

                  if in_visual and '\\' in line:
                      changed += line.count('\\')
                      line = line.replace('\\', '╲')

                  out.append(line)

                  if in_visual:
                      marker_count = line.count('"""')
                      if starts:
                          if marker_count >= 2:
                              in_visual = False
                      elif marker_count >= 1:
                          in_visual = False

              path.write_text(''.join(out), encoding='utf-8')
              return changed

          def normalize_prerequisite_entries(path: Path, ids: set[int]) -> int:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              out = []
              active = None
              changed = 0

              for line in lines:
                  stripped = line.lstrip()
                  if active is None:
                      for num in ids:
                          if stripped.startswith(f'{num}: """'):
                              active = num
                              break

                  if active is not None and '\\' in line:
                      # Only diagram slashes inside the LC98/LC236 prerequisite
                      # blocks are normalized. Keep ordinary Python escapes such
                      # as quoted strings elsewhere in this file untouched.
                      diagram_line = ('/' in line or '\\' in line) and not ('\\"' in line)
                      if diagram_line:
                          changed += line.count('\\')
                          line = line.replace('\\', '╲')

                  out.append(line)

                  if active is not None and '""",' in line:
                      active = None

              path.write_text(''.join(out), encoding='utf-8')
              return changed

          total = 0
          for path in visual_paths:
              count = normalize_visual_blocks(path)
              total += count
              print(f'{path}: normalized {count} visual diagram backslashes')

          prereq_path = Path('tools/pedagogy_prerequisites.py')
          prereq_count = normalize_prerequisite_entries(prereq_path, {98, 236})
          total += prereq_count
          print(f'{prereq_path}: normalized {prereq_count} prerequisite diagram backslashes')

          if total == 0:
              raise RuntimeError('no diagram backslashes were normalized; expected warning sources not found')
          # The five rendered tree strokes are each escaped as two backslash
          # characters in Python source, so the canonical source count is ten.
          if prereq_count != 10:
              raise RuntimeError(f'expected exactly 10 escaped LC98/LC236 prerequisite diagram backslashes, got {prereq_count}')
          print(f'normalized diagram backslashes: {total}')
          PY

      - name: Check Python sources for warnings
        run: |
          python3 -Wall -m compileall -q tools 2>&1 | tee /tmp/python-warnings.log
          if grep -E 'SyntaxWarning|DeprecationWarning|warning:' /tmp/python-warnings.log; then
            echo 'Python warning remains after diagram cleanup'
            exit 1
          fi

      - name: Regenerate learning artifacts
        run: |
          python3 tools/gen_all.py
          python3 tools/gen_review_report.py

      - name: Run fidelity and metadata gates
        run: |
          python3 tools/check_generated_fidelity.py
          make verify-meta

      - name: Run full compile and judges with zero compiler warnings
        run: |
          set -o pipefail
          make verify 2>&1 | tee /tmp/full-verify.log
          if grep -E 'warning:' /tmp/full-verify.log; then
            echo 'Compiler warning remains after diagram cleanup'
            exit 1
          fi

      - name: Remove one-shot workflow and Python caches
        run: |
          rm -f .github/workflows/reasoning-diagram-warning-cleanup.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit warning-free generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: normalize reasoning diagrams without escape warnings"
          git push origin HEAD:learning/reasoning-first-full-migration-v3
