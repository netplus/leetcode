name: Case validation finalizer

on:
  push:
    branches:
      - learning/case-validation-enrichment

permissions:
  contents: read

jobs:
  full-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict case audit
        run: python3 tools/check_case_coverage.py --strict
      - name: Full repository verification
        run: make verify
