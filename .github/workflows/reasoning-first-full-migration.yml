name: Reasoning-first full migration

on:
  push:
    branches:
      - learning/reasoning-first-full-migration-v3

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: learning/reasoning-first-full-migration-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply canonical migration and regenerate
        run: |
          python3 tools/apply_reasoning_first_migration.py
          python3 tools/gen_all.py

      - name: Validate canonical/generated fidelity and all judges
        run: |
          python3 tools/check_generated_fidelity.py
          make verify-meta
          make verify

      - name: Remove one-shot migration machinery
        run: |
          rm -f tools/apply_reasoning_first_migration.py
          rm -f .github/workflows/reasoning-first-full-migration.yml

      - name: Commit full migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: migrate all problems to reasoning-first pedagogy"
          git push origin HEAD:learning/reasoning-first-full-migration-v3
