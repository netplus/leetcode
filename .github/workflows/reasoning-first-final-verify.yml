name: Reasoning-first final regeneration and gate

on:
  push:
    branches:
      - learning/reasoning-first-full-migration-v3

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: learning/reasoning-first-full-migration-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Wire manual reasoning overrides into canonical pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/refined_data.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from pedagogy_reasoning_first import REASONING_FIRST_OVERRIDES\n'
          import_new = import_anchor + 'from pedagogy_reasoning_manual import MANUAL_REASONING_OVERRIDES\n'
          if 'from pedagogy_reasoning_manual import MANUAL_REASONING_OVERRIDES\n' not in text:
              if import_anchor not in text:
                  raise RuntimeError('refined_data.py reasoning-first import anchor missing')
              text = text.replace(import_anchor, import_new, 1)

          merge_anchor = '''for num, patch in REASONING_FIRST_OVERRIDES.items():
              if num not in REFINEMENTS:
                  raise RuntimeError(f"reasoning-first override references unknown lc{num}")
              REFINEMENTS[num] = {**REFINEMENTS[num], **patch}
          '''
          merge_new = merge_anchor + '''
          # High-touch semantic corrections for problems where the generated bridge
          # would otherwise describe the optimized algorithm as the "general solution".
          # These fields intentionally override only the reasoning bridge; reviewed
          # core/formula/steps/proof/code remain owned by the existing pedagogy layers.
          for num, patch in MANUAL_REASONING_OVERRIDES.items():
              if num not in REFINEMENTS:
                  raise RuntimeError(f"manual reasoning override references unknown lc{num}")
              REFINEMENTS[num] = {**REFINEMENTS[num], **patch}
          '''
          if 'for num, patch in MANUAL_REASONING_OVERRIDES.items():' not in text:
              if merge_anchor not in text:
                  raise RuntimeError('refined_data.py reasoning merge anchor missing')
              text = text.replace(merge_anchor, merge_new, 1)

          path.write_text(text, encoding='utf-8')

          agents = Path('AGENTS.md')
          atext = agents.read_text(encoding='utf-8')
          old = '''5. `tools/pedagogy_reasoning_first.py`: full-plan natural-solution / limitation / generalization / algorithm-background bridge;
          6. `tools/code_comment_overrides.py` plus modular `tools/code_comments_week*.py`: reviewed implementation comments;
          7. `tools/refined_data.py`: merges canonical layers, validates full reasoning-first coverage, and renders pedagogy;
          8. `tools/statement_metadata.py`: effective learner-facing statement metadata;
          9. `tools/gen_all.py`: renders `solution.cpp`, `test.in`, and Week 4 mock packages.
          '''
          new = '''5. `tools/pedagogy_reasoning_first.py`: full-plan generated reasoning bridge for entries already backed by reviewed derivation evidence;
          6. `tools/pedagogy_reasoning_manual.py`: high-touch semantic overrides where the generated bridge would skip the natural-solution stage;
          7. `tools/code_comment_overrides.py` plus modular `tools/code_comments_week*.py`: reviewed implementation comments;
          8. `tools/refined_data.py`: merges canonical layers, validates full reasoning-first coverage, and renders pedagogy;
          9. `tools/statement_metadata.py`: effective learner-facing statement metadata;
          10. `tools/gen_all.py`: renders `solution.cpp`, `test.in`, and Week 4 mock packages.
          '''
          if old in atext:
              atext = atext.replace(old, new, 1)
          elif '`tools/pedagogy_reasoning_manual.py`' not in atext:
              raise RuntimeError('AGENTS.md canonical pipeline anchor missing')
          agents.write_text(atext, encoding='utf-8')
          PY

      - name: Assert semantic bridge coverage
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')

          from pedagogy_reasoning_manual import MANUAL_REASONING_OVERRIDES
          from refined_data import REFINEMENTS

          expected = {
              1, 14, 19, 20, 21, 46, 53, 78, 79, 94, 102, 104,
              133, 144, 145, 199, 200, 206, 207, 210, 226, 236, 695, 1109,
          }
          actual = set(MANUAL_REASONING_OVERRIDES)
          if actual != expected:
              raise RuntimeError(
                  f'manual reasoning coverage mismatch: missing={sorted(expected-actual)}, '
                  f'extra={sorted(actual-expected)}'
              )

          generic_prefix = '这道题的一般性逻辑本身已经接近目标复杂度'
          leftovers = sorted(
              num for num, item in REFINEMENTS.items()
              if item.get('limitations', '').startswith(generic_prefix)
          )
          if leftovers:
              raise RuntimeError(f'generic fallback still active for: {leftovers}')

          for num in expected:
              manual = MANUAL_REASONING_OVERRIDES[num]
              effective = REFINEMENTS[num]
              for field in (
                  'visual', 'general_solution', 'limitations',
                  'generalization', 'algorithm_background',
              ):
                  if effective.get(field) != manual.get(field):
                      raise RuntimeError(f'lc{num}: manual field not effective: {field}')

          reasoning_required = {
              'visual', 'general_solution', 'limitations', 'generalization',
              'algorithm_background', 'core', 'formula', 'steps', 'proof',
              'pitfalls', 'transfer', 'code',
          }
          missing = {
              num: sorted(reasoning_required - set(item))
              for num, item in REFINEMENTS.items()
              if reasoning_required - set(item)
          }
          if missing:
              raise RuntimeError(f'reasoning-first coverage incomplete: {missing}')

          print('Semantic reasoning bridge OK: 24/24 manual fallbacks replaced; 106/106 entries complete.')
          PY

      - name: Regenerate all learning artifacts
        run: |
          python3 tools/gen_all.py
          python3 tools/gen_review_report.py

      - name: Run complete repository gate
        run: |
          python3 tools/check_generated_fidelity.py
          make verify-meta
          make verify

      - name: Remove one-shot verification workflows
        run: |
          rm -f .github/workflows/reasoning-first-final-verify.yml
          rm -f .github/workflows/reasoning-first-audit.yml

      - name: Commit regenerated canonical and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: finalize reasoning-first full regeneration"
          git push origin HEAD:learning/reasoning-first-full-migration-v3
