name: temporary-case-audit

on:
  push:
    branches:
      - learning/case-coverage-expansion-v2

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate semantic case expansion
        run: python3 tools/tmp_apply_case_expansion.py

      - name: Audit strict case structure
        run: python3 tools/check_case_coverage.py --strict

      - name: Run full repository verification
        run: make verify

      - name: Summarize expanded coverage
        run: python3 tools/tmp_case_audit.py

      - name: Commit generated cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/**/cases
          if git diff --cached --quiet; then
            echo "No case changes to commit"
            exit 0
          fi
          git commit -m "test: expand semantic coverage across formal suites [skip ci]"
          git push origin HEAD:learning/case-coverage-expansion-v2
